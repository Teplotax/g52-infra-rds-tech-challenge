name: "2 - [DEV] Build and Deploy"

# só roda no merge em develop; o PR (aberto pelo workflow 1) não dispara nada
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy dev
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit

  create:
    name: Create PR
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --all

          LAST=$(git for-each-ref \
            --format='%(refname:short)' \
            refs/remotes/origin/release/v* \
            | sed 's|origin/release/v||' \
            | sort -V \
            | tail -n 1)

          if [ -z "$LAST" ]; then
            NEXT="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST"
            PATCH=$((PATCH + 1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi

          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release branch
        id: branch
        run: |
          VERSION="${{ steps.version.outputs.next_version }}"
          BRANCH="release/v$VERSION"

          git fetch --all

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch already exists. Reusing."
          else
            git checkout main
            git pull origin main
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
          fi

          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create PR (develop -> release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"

          EXISTS=$(gh pr list \
            --head develop \
            --base "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTS" -eq "0" ]; then
            gh pr create \
              --base "$BRANCH" \
              --head develop \
              --title "Release $BRANCH" \
              --body "Promoting develop into $BRANCH"
          else
            echo "PR already exists. Skipping."
          fi
